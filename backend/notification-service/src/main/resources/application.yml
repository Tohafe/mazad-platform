spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL}/${NOTIFICATION_DB_NAME} 
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        order_inserts: true
        jdbc:
          batch_size: 100
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_URL:kafka-c:9093}
    topics:
      bid-events: ${AUCTION_UPDATE_TOPIC:bid-events}
      chat-events: ${CHAT_UPDATE_TOPIC:chat-messages-topic}
    consumer:
      group-id: ${KAFKA_GROUP_ID:notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer