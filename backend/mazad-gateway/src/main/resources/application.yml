server:
  port: 8443
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:/etc/ssl/gateway.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:mazad-ssl-password}
    key-store-type: PKCS12
    key-alias: gateway

spring:
  application:
    name: mazad-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  config:
    import: optional:file:../../.env[.properties]

    

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
           ssl:
          # This tells the gateway to trust your root CA file
            # trusted-x509-certificates: 
            #   - ${SSL_TRUSTSTORE_CERT:/etc/ssl/mazad-root-ca.crt}
              
          # Configure httpclient SSL - use insecure trust manager to verify routing works
          # httpclient:
          #   ssl:
              use-insecure-trust-manager: true

          default-filters:
            - AddRequestHeader=X-Source, Mazad-Gateway

          routes:
            # OpenAPI docs (Public Items only will be available at /v3/api-docs/public-items)
            - id: item-service-openapi
              uri: ${ITEMS_SERVICE_URL:https://items-service:8443}
              predicates:
                - Path=/v3/api-docs/**

            # Optional: serve docs UI static files from item-service resources (/docs/index.html)
            - id: item-service-docs-ui
              uri: ${ITEMS_SERVICE_URL:https://items-service:8443}
              predicates:
                - Path=/docs/**

            # Items Public API Route
            - id: item-service-public-route
              uri: ${ITEMS_SERVICE_URL:https://items-service:8443}
              predicates:
                - Path=/api/items/**
              filters:
                - name: ApiKeyFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@resolveKey}"

            # Items Internal API Route
            - id: item-service-route
              uri: ${ITEMS_SERVICE_URL:https://items-service:8443}
              predicates:
                - Path=/api/v1/items/**, /api/v1/categories/**, /api/v1/catalog/**
              filters:
                - name: ApiKeyFilter


            - id: auth-service-route
              uri: ${AUTH_SERVICE_URL:https://auth-service:8443}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2

            - id: user-service-route
              uri: ${USER_SERVICE_URL:https://user-service:8443}
              predicates:
                - Path=/api/v1/profile/**,/api/v1/friends/**
              filters:
                - StripPrefix=2

            - id: bidding-service-route
              uri: ${BIDDING_SERVICE_URL:https://bidding-service:8443}
              predicates:
                - Path=/api/v1/bids/**
              filters:
                - StripPrefix=2

            - id: chat-service-route
              uri: ${CHAT_SERVICE_URL:https://chat-service:8443}
              predicates:
                - Path=/api/v1/chat/**

            - id: notification-service-route
              uri: ${NOTIFICATION_SERVICE_URL:https://notification-service:8443}
              predicates:
                - Path=/ws/**,/api/notifications/**
              # filters:
              #   - StripPrefix=2

            # - id: notification-service-route
            #   uri: http://notification-service:8080
            #   predicates:
            #     - Path=/ws/**

            # - id: upload-service-route
            #   uri: http://upload-service:8080
            #   predicates:
            #     - Path=/api/v1/api/media/**
            #   filters:
            #     - StripPrefix=2k

            - id: upload-service-route
              uri: ${UPLOAD_SERVICE_URL:https://upload-service:8443}
              predicates:
                - Path=/api/v1/api/media/**
              filters:
                - StripPrefix=2

            - id: minio-route
              uri: ${MAZD_MINIO_URL:https://mazad-minio:9000}
              predicates:
                - Path=/api/upload/minio/**
              filters:
                - StripPrefix=3
                
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONT_URL}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-API-KEY
                allowCredentials: true 