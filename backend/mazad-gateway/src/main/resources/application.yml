server:
  port: 8443
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:/etc/ssl/gateway.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:mazad-ssl-password}
    key-store-type: PKCS12
    key-alias: gateway

spring:
  application:
    name: mazad-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  config:
    import: optional:file:../../.env[.properties]

    

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddRequestHeader=X-Source, Mazad-Gateway

          routes:
            # OpenAPI docs (Public Items only will be available at /v3/api-docs/public-items)
            - id: item-service-openapi
              uri: https://items-service:8443
              predicates:
                - Path=/v3/api-docs/**

            # Items Public API Route
            - id: item-service-public-route
              uri: https://items-service:8443
              predicates:
                - Path=/api/items/**
              filters:
                - name: ApiKeyFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@resolveKey}"

            # Items Internal API Route
            - id: item-service-route
              uri: https://items-service:8443
              predicates:
                - Path=/api/v1/items/**, /api/v1/categories/**, /api/v1/catalog/**


            - id: auth-service-route
              uri: https://auth-service:8443
              predicates:
                - Path=/api/v1/auth/**,/oauth2/**,/login/oauth2/**

            - id: user-service-route
              uri: https://user-service:8443
              predicates:
                - Path=/api/v1/profile/**,/api/v1/friends/**
              filters:
                - StripPrefix=2

            - id: bidding-service-route
              uri: https://bidding-service:8443
              predicates:
                - Path=/api/v1/bids/**,/api/v1/wallet
              filters:
                - StripPrefix=2

            - id: chat-service-route
              uri: https://chat-service:8443
              predicates:
                - Path=/api/v1/chat/**

            - id: notification-service-route
              uri: https://notification-service:8443
              predicates:
                - Path=/ws/**,/api/v1/notifications/**
            - id: upload-service-route
              uri: https://upload-service:8443
              predicates:
                - Path=/api/v1/media/**
              filters:
                - StripPrefix=2

            - id: minio-route
              uri: https://mazad-minio:9000
              predicates:
                - Path=/api/v1/storage/**
              filters:
                - StripPrefix=3
                
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONT_URL}
                  # //for frontend Dev, remove it before push @Naoufal
                  - http://10.30.243.50:5173.nip.io #@Naoufal
                  - https://10.30.243.50.nip.io #@Naoufal
                  - http://10.30.245.151:5173
                  - http://10.30.245.151:5173
                  - 'http://localhost:5173'
                  - 'http://127.0.0.1:5173'
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-API-KEY
                allowCredentials: true 