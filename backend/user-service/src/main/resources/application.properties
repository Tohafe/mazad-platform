spring.config.import=optional:file:../../.env[.properties]

spring.application.name=user-service

server.port=${USER_SERVER_PORT:8443}

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:/etc/ssl/user-service.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:mazad-ssl-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=user-service

spring.datasource.url=${DB_URL}/${USER_DB_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

auth-user.sync.key=${USER_AUTH_SYNC_KEY}

user.default.avatar=${AVATAR_URL}
user.default.thumbnail=${AVATAR_THUMBNAIL_URL}

spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.show-sql=true
