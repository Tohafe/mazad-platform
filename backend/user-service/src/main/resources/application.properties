spring.config.import=optional:file:../../.env[.properties]

spring.application.name=user-service

server.port=${USER_SERVER_PORT}

spring.datasource.url=${DB_URL}/${USER_DB_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
item.updated.topic=${ITEM_UPDATED_TOPIC}
item.created.topic=${ITEM_CREATED_TOPIC}
notify.friends.topic=${NOTIFY_FRIENDS_TOPIC}
friend.request.topic={FRIEND_REQUEST_TOPIC}

auth-user.sync.key=${USER_AUTH_SYNC_KEY}

user.default.avatar=${AVATAR_URL}
user.default.thumbnail=${AVATAR_THUMBNAIL_URL}

spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.show-sql=true
