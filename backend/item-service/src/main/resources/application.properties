spring.config.import=optional:file:../../.env[.properties]

spring.application.name=item-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=${ITEMS_SERVICE_PORT:8000}

spring.kafka.bootstrap-servers=kafka-service:9093
#spring.kafka.consumer.group-id=auction-group
#spring.kafka.consumer.auto-offset-reset=earliest

item.created.topic=${ITEM_CREATED_TOPIC}
item.updated.topic=${ITEM_UPDATED_TOPIC}
auction.update.topic=${AUCTION_UPDATE_TOPIC}
