spring.config.import=optional:file:../../.env[.properties]

spring.application.name=auth-service

server.port=${AUTH_SERVER_PORT:8443}

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:/etc/ssl/auth-service.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:mazad-ssl-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=auth-service

spring.datasource.url=${DB_URL}/${AUTH_DB_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.show-sql=true

auth.secret-key=${AUTH_SECRET_KEY}
auth.access-token-validity-min=${ACCESS_TOKEN_MIN:15}
auth.refresh-token-validity-days=${REFRESH_TOKEN_DAY:4}

auth-user.sync.topic=${USER_AUTH_SYNC_TOPIC}
user-service.url=${USER_SERVICE_URL:https://user-service:8443}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
## OAuth2 Client Registration
spring.security.oauth2.client.registration.42.client-id=${FORTY_TWO_CLIENT_ID}
spring.security.oauth2.client.registration.42.client-secret=${FORTY_TWO_CLIENT_SECRET}

spring.security.oauth2.client.registration.42.scope=public
spring.security.oauth2.client.registration.42.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.42.redirect-uri={baseUrl}/login/oauth2/code/42


# OAuth2 Provider Settings
spring.security.oauth2.client.provider.42.authorization-uri=https://api.intra.42.fr/oauth/authorize
spring.security.oauth2.client.provider.42.token-uri=https://api.intra.42.fr/oauth/token
spring.security.oauth2.client.provider.42.user-info-uri=https://api.intra.42.fr/v2/me
spring.security.oauth2.client.provider.42.user-name-attribute=login
#spring.security.oauth2.client.registration.42.client-authentication-method=client_secret_post

# CRITICAL FOR GATEWAY SETUP
server.forward-headers-strategy=framework

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

