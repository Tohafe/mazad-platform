spring.application.name=chat-service
server.port=${CHAT_SERVICE_PORT:8443}

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:/etc/ssl/chat-service.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:mazad-ssl-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=chat-service

# DB 
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA 
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Kafka
spring.kafka.bootstrap-servers=kafka-service:${KAFKA_SERVICE_PORT}

# spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

chat.kafka.topic=chat-messages-topic
 




