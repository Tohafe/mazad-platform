spring.application.name=chat-service
server.port=8443

# SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:/etc/ssl/chat-service.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:mazad-ssl-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=chat-service

# DB 
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA 
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Kafka
spring.kafka.bootstrap-servers=kafka-service:9093
chat.kafka.topic=${CHAT_MESSAGES_TOPIC:chat-messages-topic}
 