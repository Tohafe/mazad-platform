upstream gateway {
    server mazad-gateway:8443;
}

server {
    listen 80;
    server_name mazzad.tech www.mazzad.tech localhost;
    return 301 https://www.mazzad.tech$request_uri;
}

# 2. Redirect HTTPS www.mazzad.tech to HTTPS mazzad.tech
server {
    listen 443 ssl;
    server_name mazzad.tech;

    ssl_certificate /etc/nginx/ssl/nginx.pem;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    return 301 https://www.mazzad.tech$request_uri;
}

limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_v1_limit:10m rate=10r/s;

limit_req_status 429;

server {
    listen 443 ssl;
    server_name www.mazzad.tech;

    client_max_body_size 50M;      # Allows uploads up to 50 Megabytes
    client_body_buffer_size 16M;   # Keeps up to 16MB of the upload in RAM (Fast!)

    # SSL Configuration (Browser -> Nginx)
    ssl_certificate /etc/nginx/ssl/nginx.pem;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trusted CA for upstream connections (Nginx -> Gateway)
    proxy_ssl_trusted_certificate /etc/nginx/ssl/mazad-root-ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_session_reuse on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API proxy - route /api requests to gateway (HTTPS)

    location /api/v1/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        
        proxy_pass https://gateway/api/v1/auth/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }


   location /api/v1/storage/ {
        proxy_pass https://gateway/api/v1/storage/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/ {
        limit_req zone=api_v1_limit burst=20 nodelay;
        
        proxy_pass https://gateway/api/v1/;
      include /etc/nginx/conf.d/proxy_params.conf;
    }


    location /api/ {
        proxy_pass https://gateway/api/;
      include /etc/nginx/conf.d/proxy_params.conf;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for real-time features (bidding, chat, notifications)
    # Handle both /ws and /ws/ with query params
    location /ws {
        proxy_pass https://gateway/ws;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mazad-gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host mazad-gateway;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout (keep connection alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 1. Start the OAuth flow
        location /oauth2/ {
            proxy_pass https://gateway/oauth2/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name mazad-gateway;
            proxy_set_header Host mazad-gateway;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host; # CRITICAL for {baseUrl}
        }

        # 2. Handle the 42 Callback
        location /login/oauth2/ {
            proxy_pass https://gateway/login/oauth2/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name mazad-gateway;
            proxy_set_header Host mazad-gateway;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host; # CRITICAL for {baseUrl}
        }



    # Serve static files (React build)
    location / {
        limit_req zone=frontend_limit burst=30 nodelay;
        root /usr/share/nginx/html;
        index index.html;

        # Handle client-side routing (SPA)
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Gateway-hosted Swagger UI static page
    location /docs/ {
        proxy_pass https://gateway/docs/;
      include /etc/nginx/conf.d/proxy_params.conf;
    }
    location /v3/api-docs/ {
        proxy_pass https://gateway/v3/api-docs/;
      include /etc/nginx/conf.d/proxy_params.conf;
    }
   }
